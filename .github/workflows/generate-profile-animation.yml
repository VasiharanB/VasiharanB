name: Generate Cinematic Profile Animation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-profile-animation.yml"
      - "assets/profile_animation.py"
      - "assets/header.svg"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow cairosvg

      - name: Generate animated GIF from header SVG
        run: python assets/profile_animation.py

      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.gif
          git diff --cached --quiet || git commit -m "chore(profile): bake animated header SVG into hero GIF"
          git push
