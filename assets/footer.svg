<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" height="170">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F4605" stop-opacity="0"/>
      <stop offset="32%" stop-color="#E1AD3E" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFF0A6" stop-opacity="1"/>
      <stop offset="68%" stop-color="#E1AD3E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6F4605" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <line x1="60" y1="30" x2="1140" y2="30" stroke="url(#line)" stroke-width="2"/>
  <circle cx="600" cy="30" r="5" fill="#F5D978">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#E9E2D3">
    BUILD • LEARN • SHIP • REPEAT
  </text>
  <text x="600" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#938B7B" letter-spacing="1.2">
    Every project is a system. Every commit is a step.
  </text>
  <text x="600" y="136" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-size="11" fill="#6F6759">
    VASIHARAN B • FULL-STACK • AI • SYSTEMS
  </text>
</svg>